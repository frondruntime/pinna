<!-- The header mark, drawn as beams on a 64-unit grid: a lime frame at 70% with its corners lit, the stem and two pairs of leaves, and a cyan tip. A bright edge also keeps Safari from framing the dark icon in a light border of its own. Stroke width 2 lands the frame on whole pixels at 32px. -->
